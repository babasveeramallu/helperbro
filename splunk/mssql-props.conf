# Install on the forwarder and parsing/indexing tier for the custom ERRORLOG input.
# AUTO recognizes BOM-encoded Windows SQL ERRORLOGs; confirm actual encoding.
[ccdc:mssql:errorlog]
CHARSET = AUTO
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)(?=\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2})
TIME_PREFIX = ^
TIME_FORMAT = %Y-%m-%d %H:%M:%S.%3N
MAX_TIMESTAMP_LOOKAHEAD = 23
